// ── SVG Helpers ───────────────────────────────────────────────────────────────
function ns(tag, attrs = {}, inner = "") {
  const a = Object.entries(attrs).map(([k,v]) => `${k}="${v}"`).join(" ");
  return `<${tag} ${a}>${inner}</${tag}>`;
}

function linkPath(x1, y1, x2, y2, curvature = 70) {
  if (x1 === x2 && y1 === y2) {
    return `M ${x1-25} ${y1-30} C ${x1-90} ${y1-110} ${x1+90} ${y1-110} ${x2+25} ${y2-30}`;
  }
  const dx = x2 - x1, dy = y2 - y1;
  const len = Math.sqrt(dx*dx + dy*dy) || 1;
  const px = -dy / len, py = dx / len;
  const qx = ((x1+x2)/2 + px * curvature).toFixed(1);
  const qy = ((y1+y2)/2 + py * curvature).toFixed(1);
  return `M ${x1} ${y1} Q ${qx} ${qy} ${x2} ${y2}`;
}

function labelPos(x1, y1, x2, y2, curvature = 70) {
  if (x1 === x2 && y1 === y2) return { x: x1, y: y1 - 120 };
  const dx = x2 - x1, dy = y2 - y1;
  const len = Math.sqrt(dx*dx + dy*dy) || 1;
  const px = -dy / len, py = dx / len;
  return {
    x: ((x1+x2)/2 + px * curvature * 0.7).toFixed(1),
    y: ((y1+y2)/2 + py * curvature * 0.7).toFixed(1)
  };
}

).join("\n");

function markerId(band) {
  return `url(#arrow-${band.replace(/[^a-z]/g,'')})`;
}

  if (!src || !tgt) return "";
  const curv = lk.label && CURV[lk.label] !== undefined ? CURV[lk.label] : 65;
  const d = linkPath(src.x, src.y, tgt.x, tgt.y, curv);
  const col = BAND_COLORS[lk.band] || "#ffffff";
  const sw  = (1.8 + lk.sigma * 3.0).toFixed(1);
  const op  = lk.conf === "verified" ? 0.92 : lk.conf === "indicative" ? 0.68 : 0.40;
  const mid = labelPos(src.x, src.y, tgt.x, tgt.y, curv);
  const dashArray = lk.conf === "speculative" ? 'stroke-dasharray="6,4"' : '';
  const arrow = markerId(lk.band);

  let labelEl = "";
  if (lk.label) {
    labelEl = `<rect x="${Number(mid.x)-16}" y="${Number(mid.y)-10}" width="32" height="20" rx="4" fill="#1e293b" stroke="${col}" stroke-width="1"/>

  }

  return `<path d="${d}" fill="none" stroke="${col}" stroke-width="${sw}" stroke-opacity="${op}" ${dashArray} marker-end="${arrow}"/>
${labelEl}`;
}).join("\n");

<rect x="0" y="130" width="${W}" height="110" fill="#0d1526"/>
