// ── HIT TARGETS + HOVER/ACTIVE RINGS ─────────────────────────────────────────
// Transparent circles on top of all visual layers; carry data-qi="s_z_p"
const hitG = grp({'cursor':'default'});

// Persistent hover ring (single, repositioned on hover)
const hoverRing = document.createElementNS(NS,'circle');
hoverRing.setAttribute('r','20');
hoverRing.setAttribute('fill','none');
hoverRing.setAttribute('stroke','#ffffff');
hoverRing.setAttribute('stroke-width','1.5');
hoverRing.setAttribute('stroke-opacity','0.35');
hoverRing.setAttribute('pointer-events','none');
hoverRing.style.display='none';
svg.appendChild(hoverRing);

// Persistent active ring (shown on selected dot)
const activeRing = document.createElementNS(NS,'circle');
activeRing.setAttribute('r','22');
activeRing.setAttribute('fill','none');
activeRing.setAttribute('stroke','#ffffff');
activeRing.setAttribute('stroke-width','2');
activeRing.setAttribute('opacity','0.8');
activeRing.setAttribute('pointer-events','none');
activeRing.style.display='none';
svg.appendChild(activeRing);

// Build hit targets
for (const q of QI) {
  const {x,y}=pos(q.s,q.z,q.p);
  const m=q.multi&&q.multi>1;
  const hit=inGrp(hitG,'circle',{
    cx:x, cy:y, r: m?16:13,
    fill:'transparent', 'pointer-events':'all',
    cursor:'pointer',
    'data-qi':`${q.s}_${q.z}_${q.p}`,
  });
}

// ── INTERACTION STATE ─────────────────────────────────────────────────────────
let flatIdx = 0;
let drawerOpen = false;

const backdrop   = document.getElementById('qi-backdrop');
const drawer     = document.getElementById('qi-drawer');
const coordEl    = document.getElementById('qi-drawer-coord');
const zoneBadge  = document.getElementById('qi-drawer-zone-badge');
const entriesEl  = document.getElementById('qi-drawer-entries');
const navCount   = document.getElementById('qi-nav-count');
const navCoord   = document.getElementById('qi-nav-coord-label');
const btnClose   = document.getElementById('qi-drawer-close');
const btnPrev    = document.getElementById('qi-nav-prev');
const btnNext    = document.getElementById('qi-nav-next');

function openDrawerAt(idx) {
  flatIdx = idx;
  drawerOpen = true;
  renderDrawer();
  drawer.classList.add('open');
  backdrop.classList.add('open');
}

function closeDrawer() {
  drawerOpen = false;
  drawer.classList.remove('open');
  backdrop.classList.remove('open');
  activeRing.style.display = 'none';
}

function moveActiveRing(entry) {
  const {x,y}=pos(entry.s, entry.z, entry.p);
  activeRing.setAttribute('cx', x);
  activeRing.setAttribute('cy', y);
  activeRing.setAttribute('stroke', ZONES[entry.z].color);
  activeRing.style.display = '';
}

function renderDrawer() {
  const entry = FLAT_ORDERED[flatIdx];
  const zone  = ZONES[entry.z];
  const phase = PHASES[entry.p];
  const allAtCoord = BY_COORD.get(entry.coord) || [entry];

  // Header
  coordEl.textContent = `Scale: ${SCALES[entry.s]}  ·  Zone: ${zone.name}  ·  Phase: ${phase.label}`;
  zoneBadge.textContent = `${zone.glyph} ${zone.name}`;
  zoneBadge.style.color = zone.color;
  zoneBadge.style.borderColor = zone.color;

  // Nav count
  navCount.textContent = `${flatIdx+1} / ${FLAT_ORDERED.length}`;
  btnPrev.disabled = flatIdx === 0;
  btnNext.disabled = flatIdx === FLAT_ORDERED.length - 1;

  // Coordinate label in footer
  navCoord.textContent = `s${entry.s}·z${entry.z}·p${entry.p}  ·  id: ${entry.id}`;

  // Entries
  entriesEl.innerHTML = '';
  for (let i=0; i<allAtCoord.length; i++) {
    const en = allAtCoord[i];
    const zn = ZONES[en.z];
    const card = document.createElement('div');
    card.className = 'qi-entry-card';
    card.style.setProperty('--zone-color', zn.color);

    if (allAtCoord.length > 1) {
      const ml = document.createElement('div');
      ml.className = 'qi-entry-multi-label';
      ml.textContent = `Entry ${i+1} of ${allAtCoord.length}  ·  multi-occupied cell`;
      card.appendChild(ml);
    }

    const title = document.createElement('div');
    title.className = 'qi-entry-title';
    title.textContent = en.title;
    card.appendChild(title);

    const badge = document.createElement('span');
    badge.className = `qi-evidence-badge ${en.evidence}`;
    badge.textContent = en.evidence;
    card.appendChild(badge);

    const narLabel = document.createElement('div');
    narLabel.className = 'qi-section-label';
    narLabel.textContent = 'Biological / Architectural Narrative';
    card.appendChild(narLabel);

    const nar = document.createElement('div');
    nar.className = 'qi-narrative';
    nar.textContent = en.narrative;
    card.appendChild(nar);

    if (en.hardwareAnalogue) {
      const hwLabel = document.createElement('div');
      hwLabel.className = 'qi-section-label';
      hwLabel.textContent = 'Hardware Analogue';
      card.appendChild(hwLabel);
      const hw = document.createElement('div');
      hw.className = 'qi-hw-analogue';
      hw.textContent = en.hardwareAnalogue;
      card.appendChild(hw);
    }

    if (en.substrateIds && en.substrateIds.length) {
      const subLabel = document.createElement('div');
      subLabel.className = 'qi-section-label';
      subLabel.textContent = 'Substrate IDs';
      card.appendChild(subLabel);
      const chips = document.createElement('div');
      chips.className = 'qi-substrates';
      for (const sid of en.substrateIds) {
        const chip = document.createElement('span');
        chip.className = 'qi-substrate-chip';
        chip.textContent = sid;
        chips.appendChild(chip);
      }
      card.appendChild(chips);
    }

    const idEl = document.createElement('div');
    idEl.className = 'qi-entry-id';
    idEl.textContent = en.id;
    card.appendChild(idEl);

    entriesEl.appendChild(card);
  }

  entriesEl.scrollTop = 0;
  moveActiveRing(entry);
}

// ── EVENT DELEGATION ──────────────────────────────────────────────────────────
// SVG click — open drawer for populated dot
svg.addEventListener('click', ev => {
  const hit = ev.target.closest('[data-qi]');
  if (!hit) return;
  const coord = hit.getAttribute('data-qi');
  // Find flatIdx of first entry at this coord
  const idx = FLAT_ORDERED.findIndex(en => en.coord === coord);
  if (idx < 0) return;
  if (drawerOpen && FLAT_ORDERED[flatIdx].coord === coord) { closeDrawer(); return; }
  openDrawerAt(idx);
});

// SVG hover
svg.addEventListener('mouseover', ev => {
  const hit = ev.target.closest('[data-qi]');
  if (!hit) { hoverRing.style.display='none'; return; }
  const [s,z,p] = hit.getAttribute('data-qi').split('_').map(Number);
  const {x,y}=pos(s,z,p);
  hoverRing.setAttribute('cx',x); hoverRing.setAttribute('cy',y);
  hoverRing.setAttribute('stroke', ZONES[z].color);
  hoverRing.style.display='';
});
svg.addEventListener('mouseout', ev => {
  if (!ev.target.closest('[data-qi]')) hoverRing.style.display='none';
});

// Backdrop / close / Escape
backdrop.addEventListener('click', closeDrawer);
btnClose.addEventListener('click', closeDrawer);
document.addEventListener('keydown', ev => { if(ev.key==='Escape') closeDrawer(); });

// Prev / Next — navigate FLAT_ORDERED
btnPrev.addEventListener('click', () => { if(flatIdx>0) openDrawerAt(flatIdx-1); });
btnNext.addEventListener('click', () => { if(flatIdx<FLAT_ORDERED.length-1) openDrawerAt(flatIdx+1); });
</script>
