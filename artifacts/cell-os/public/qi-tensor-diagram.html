<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1600">
<title>Cell OS — QI Tensor Field</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#020817; width:1600px; height:900px; overflow:hidden; }
  svg { display:block; font-family:'SF Mono','Fira Code','Consolas',monospace; }
</style>
</head>
<body>
<svg id="svg" width="1600" height="900" xmlns="http://www.w3.org/2000/svg">
<defs>
  <radialGradient id="bg" cx="50%" cy="55%" r="65%">
    <stop offset="0%" stop-color="#0b1628"/>
    <stop offset="100%" stop-color="#020817"/>
  </radialGradient>
</defs>
<rect width="1600" height="900" fill="url(#bg)"/>
</svg>

<script>
const NS = 'http://www.w3.org/2000/svg';
const svg = document.getElementById('svg');

function e(tag, attrs, text) {
  const el = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs || {})) el.setAttribute(k, v);
  if (text != null) el.textContent = text;
  svg.appendChild(el);
  return el;
}
function grp(attrs) {
  const g = document.createElementNS(NS, 'g');
  for (const [k, v] of Object.entries(attrs || {})) g.setAttribute(k, v);
  svg.appendChild(g);
  return g;
}
function inGrp(g, tag, attrs, text) {
  const el = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs || {})) el.setAttribute(k, v);
  if (text != null) el.textContent = text;
  g.appendChild(el);
  return el;
}

// ── AXIS DATA (source: src/domain/content/qiMatrix.ts QI_AXES) ───────────────
// Zones index 0–7  |  zone 0=nucleus (back/deep), zone 7=membrane (front)
const ZONES = [
  { id:'nucleus',               name:'Nucleus',               glyph:'核', color:'#22d3ee' },
  { id:'cytoplasm',             name:'Cytoplasm',             glyph:'漿', color:'#34d399' },
  { id:'cytoskeleton',          name:'Cytoskeleton',          glyph:'骨', color:'#818cf8' },
  { id:'ribosomes',             name:'Ribosomes',             glyph:'糖', color:'#a3e635' },
  { id:'mitochondria',          name:'Mitochondria',          glyph:'粒', color:'#fb923c' },
  { id:'golgi',                 name:'Golgi Apparatus',       glyph:'高', color:'#c084fc' },
  { id:'endoplasmic-reticulum', name:'Endoplasmic Reticulum', glyph:'網', color:'#f472b6' },
  { id:'membrane',              name:'Cell Membrane',         glyph:'膜', color:'#7dd3fc' },
];
// Phases index 0–2  |  0=perception (bottom), 2=expression (top)
const PHASES = [
  { id:'perception', abbr:'P', label:'Perception', color:'#38bdf8' },
  { id:'affect',     abbr:'A', label:'Affect',     color:'#a78bfa' },
  { id:'expression', abbr:'E', label:'Expression', color:'#34d399' },
];
// Scales index 0–10  |  0=symbolic (left), 10=silicon (right)
const SCALES = [
  'Symbolic','Quantum','Molecular','Cellular','Organic',
  'Apparatus','Textual','Generational','Relational','Cosmic','Silicon'
];

// ── QI INTERSECTIONS — 36 entries, 33 unique (s,z,p) cells ───────────────────
// multi:N means N entries share this coordinate (architecturally permitted)
const QI = [
  // Nucleus (z=0)  ·  6 entries
  { s:1,  z:0, p:0 }, // nucleus-perception-quantum
  { s:7,  z:0, p:0 }, // qi-cellcycle-perception-generational
  { s:10, z:0, p:0 }, // nucleus-perception-silicon
  { s:3,  z:0, p:1 }, // qi-chromatin-affect-cellular
  { s:10, z:0, p:1 }, // nucleus-affect-silicon
  { s:10, z:0, p:2 }, // nucleus-expression-silicon

  // Cytoplasm (z=1)  ·  4 entries, 3 unique cells
  { s:0,  z:1, p:0 },          // cytoplasm-perception-symbolic
  { s:3,  z:1, p:1, multi:2 }, // cytoplasm-affect-cellular + qi-ups-affect-cellular
  { s:5,  z:1, p:1 },          // qi-peroxisome-affect-apparatus

  // Cytoskeleton (z=2)  ·  2 entries
  { s:5, z:2, p:0 }, // cytoskeleton-perception-apparatus
  { s:7, z:2, p:1 }, // cytoskeleton-affect-generational

  // Ribosomes (z=3)  ·  4 entries
  { s:2,  z:3, p:0 }, // ribosomes-perception-molecular
  { s:10, z:3, p:0 }, // qi-mrna-perception-silicon
  { s:10, z:3, p:1 }, // ribosomes-affect-silicon
  { s:2,  z:3, p:2 }, // ribosomes-expression-molecular

  // Mitochondria (z=4)  ·  4 entries
  { s:4,  z:4, p:0 }, // mitochondria-perception-organic
  { s:10, z:4, p:1 }, // mitochondria-affect-silicon
  { s:2,  z:4, p:2 }, // mitochondria-expression-molecular
  { s:4,  z:4, p:2 }, // qi-apoptosis-expression-organic

  // Golgi (z=5)  ·  3 entries, 2 unique cells
  { s:5, z:5, p:1 },          // golgi-affect-apparatus
  { s:6, z:5, p:2, multi:2 }, // golgi-expression-textual + qi-secretion-expression-textual

  // Endoplasmic Reticulum (z=6)  ·  4 entries
  { s:10, z:6, p:0 }, // endoplasmic-reticulum-perception-silicon
  { s:2,  z:6, p:1 }, // qi-calcium-affect-molecular
  { s:7,  z:6, p:1 }, // endoplasmic-reticulum-affect-generational
  { s:10, z:6, p:1 }, // qi-chaperone-affect-silicon

  // Membrane (z=7)  ·  9 entries, 8 unique cells
  { s:3,  z:7, p:0, multi:2 }, // membrane-perception-cellular + qi-gapjunction-perception-cellular
  { s:5,  z:7, p:0 },          // qi-ecm-perception-apparatus
  { s:6,  z:7, p:0 },          // qi-document-perception-textual
  { s:5,  z:7, p:1 },          // membrane-affect-apparatus
  { s:7,  z:7, p:1 },          // membrane-affect-generational
  { s:10, z:7, p:1 },          // qi-membranepotential-affect-silicon
  { s:0,  z:7, p:2 },          // membrane-expression-symbolic
  { s:4,  z:7, p:2 },          // qi-exocytosis-expression-organic
];

// Lookup map for occupied cells
const QI_MAP = new Map();
for (const q of QI) QI_MAP.set(`${q.s}_${q.z}_${q.p}`, q);

// ── OBLIQUE PROJECTION ────────────────────────────────────────────────────────
// Origin = front-bottom-left: membrane(z=7), perception(p=0), symbolic(s=0)
// zone depth d = 7-z  →  membrane d=0 (front), nucleus d=7 (back)
const OX = 220, OY = 740;
const STEP_X = 76;    // scale spacing (→ right)
const DEPTH_X = 28;   // zone recede x per depth step
const DEPTH_Y = 18;   // zone recede y per depth step (up = back)
const STEP_H = 104;   // phase height step (up = higher phase)

function pos(s, z, p) {
  const d = 7 - z;
  return { x: OX + s*STEP_X + d*DEPTH_X, y: OY - p*STEP_H - d*DEPTH_Y };
}

// Pre-compute zone anchor positions (at s=0, p=0) for label connectors
const ZONE_ANCHOR = ZONES.map((_, z) => pos(0, z, 0));

// ── GRID LINES ────────────────────────────────────────────────────────────────
const gridG = grp();

// Phase base planes (parallelogram per phase level)
for (let p = 0; p < 3; p++) {
  const fl = pos(0,7,p), fr=pos(10,7,p), br=pos(10,0,p), bl=pos(0,0,p);
  const c = PHASES[p].color;
  inGrp(gridG,'polygon',{
    points:`${fl.x},${fl.y} ${fr.x},${fr.y} ${br.x},${br.y} ${bl.x},${bl.y}`,
    fill:c,'fill-opacity':'0.022',stroke:c,'stroke-opacity':'0.1','stroke-width':'0.5',
  });
}

// Horizontal scale-axis lines (for each zone×phase combo)
for (let z=0;z<8;z++) for (let p=0;p<3;p++) {
  const a=pos(0,z,p), b=pos(10,z,p);
  inGrp(gridG,'line',{x1:a.x,y1:a.y,x2:b.x,y2:b.y,stroke:'#ffffff','stroke-opacity':'0.055','stroke-width':'0.5'});
}
// Depth zone-axis lines (for each scale×phase combo)
for (let s=0;s<=10;s++) for (let p=0;p<3;p++) {
  const a=pos(s,0,p), b=pos(s,7,p);
  inGrp(gridG,'line',{x1:a.x,y1:a.y,x2:b.x,y2:b.y,stroke:'#ffffff','stroke-opacity':'0.055','stroke-width':'0.5'});
}
// Vertical phase-axis lines (for each scale×zone combo)
for (let s=0;s<=10;s++) for (let z=0;z<8;z++) {
  const a=pos(s,z,0), b=pos(s,z,2);
  inGrp(gridG,'line',{x1:a.x,y1:a.y,x2:b.x,y2:b.y,stroke:'#ffffff','stroke-opacity':'0.038','stroke-width':'0.4'});
}

// ── EMPTY DOTS ────────────────────────────────────────────────────────────────
const emptyG = grp();
for (let z=0;z<8;z++) for (let p=0;p<3;p++) for (let s=0;s<=10;s++) {
  if (QI_MAP.has(`${s}_${z}_${p}`)) continue;
  const {x,y}=pos(s,z,p);
  inGrp(emptyG,'circle',{cx:x,cy:y,r:2.8,fill:'#334155',opacity:'0.26'});
}

// ── POPULATED DOTS (painter's algorithm: back z=0 → front z=7) ───────────────
const dotG = grp();
const sorted = [...QI].sort((a,b)=>a.z-b.z);

for (const q of sorted) {
  const {x,y}=pos(q.s,q.z,q.p);
  const col=ZONES[q.z].color;
  const m=q.multi&&q.multi>1;

  // Layered glow rings
  inGrp(dotG,'circle',{cx:x,cy:y,r:m?22:16,fill:col,opacity:'0.07'});
  inGrp(dotG,'circle',{cx:x,cy:y,r:m?14:10,fill:col,opacity:'0.18'});
  inGrp(dotG,'circle',{cx:x,cy:y,r:m?9:6.5,fill:col,opacity:'0.52'});
  inGrp(dotG,'circle',{cx:x,cy:y,r:m?5:3.5,fill:'#ffffff',opacity:'0.9'});

  // Biophoton rays (cardinal)
  for (const deg of [0,90,180,270]) {
    const r=deg*Math.PI/180, r0=m?7:5, r1=m?20:14;
    inGrp(dotG,'line',{x1:x+r0*Math.cos(r),y1:y+r0*Math.sin(r),x2:x+r1*Math.cos(r),y2:y+r1*Math.sin(r),stroke:col,'stroke-width':m?1.2:0.8,opacity:'0.38'});
  }
  // Diagonal rays
  for (const deg of [45,135,225,315]) {
    const r=deg*Math.PI/180, r0=m?6:4, r1=m?14:9;
    inGrp(dotG,'line',{x1:x+r0*Math.cos(r),y1:y+r0*Math.sin(r),x2:x+r1*Math.cos(r),y2:y+r1*Math.sin(r),stroke:col,'stroke-width':m?0.9:0.6,opacity:'0.22'});
  }

  // Multi-occupancy badge
  if (m) {
    inGrp(dotG,'circle',{cx:x+10,cy:y-10,r:7.5,fill:'#0f172a',stroke:col,'stroke-width':'1.2'});
    inGrp(dotG,'text',{x:x+10,y:y-6.5,'text-anchor':'middle','font-size':'8.5','font-weight':'bold',fill:col},'×'+q.multi);
  }
}

// ── LABELS ────────────────────────────────────────────────────────────────────
const LG = grp({'font-family':"'SF Mono','Fira Code','Consolas',monospace"});

// SCALE LABELS — below the front (z=7) phase-0 row, rotated
{
  const headerPt = pos(5,7,0);
  inGrp(LG,'text',{x:headerPt.x,y:headerPt.y+56,'text-anchor':'middle','font-size':'10',fill:'#475569','letter-spacing':'4'},'S C A L E   A X I S');

  for (let s=0;s<=10;s++) {
    const {x,y}=pos(s,7,0);
    inGrp(LG,'text',{
      x,y:y+22,'text-anchor':'middle','font-size':'10',fill:'#94a3b8',
      transform:`rotate(-38,${x},${y+22})`,
    },SCALES[s]);
  }
}

// PHASE LABELS — fixed column at x=OX-42, at each phase height for front zone
{
  const ax=OX-42;  // fixed x for the vertical phase axis
  // Axis spine
  const yBot=pos(0,7,0).y, yTop=pos(0,7,2).y;
  inGrp(LG,'line',{x1:ax,y1:yBot+18,x2:ax,y2:yTop-12,stroke:'#1e3a5f','stroke-width':'1.2'});

  for (let p=0;p<3;p++) {
    const ph=PHASES[p];
    const {y}=pos(0,7,p);
    // Tick
    inGrp(LG,'line',{x1:ax-6,y1:y,x2:ax+6,y2:y,stroke:ph.color,'stroke-width':'1.5',opacity:'0.7'});
    // Abbr badge
    inGrp(LG,'text',{x:ax-14,y:y+5,'text-anchor':'middle','font-size':'16','font-weight':'bold',fill:ph.color,opacity:'0.9'},ph.abbr);
    // Full label
    inGrp(LG,'text',{x:ax-26,y:y+5,'text-anchor':'end','font-size':'11',fill:ph.color,opacity:'0.6'},ph.label);
  }
}

// ZONE DEPTH AXIS — diagonal arrow along the back-left spine of the grid
//   from membrane (z=7, front) at bottom to nucleus (z=0, back) at top
{
  const front = ZONE_ANCHOR[7]; // membrane, front
  const back  = ZONE_ANCHOR[0]; // nucleus, back
  // Dashed spine line offset slightly left of the anchors
  const ox=-14, oy=0;
  inGrp(LG,'line',{
    x1:front.x+ox,y1:front.y+oy,
    x2:back.x+ox, y2:back.y+oy,
    stroke:'#334155','stroke-width':'1.2','stroke-dasharray':'3,5',
  });
  // Arrowhead at nucleus end
  inGrp(LG,'polygon',{
    points:`${back.x+ox},${back.y+oy-7} ${back.x+ox-5},${back.y+oy+3} ${back.x+ox+5},${back.y+oy+3}`,
    fill:'#334155',
  });
  // "DEPTH" label along the spine, centered, rotated
  const mx=(front.x+back.x)/2+ox-16, my=(front.y+back.y)/2;
  const angleDeg=Math.atan2(back.y-front.y,back.x-front.x)*180/Math.PI;
  inGrp(LG,'text',{
    x:mx, y:my,
    'text-anchor':'middle','font-size':'9',fill:'#334155','letter-spacing':'2',
    transform:`rotate(${angleDeg.toFixed(1)},${mx},${my})`,
  },'ZONE DEPTH');
  // Endpoint zone labels on the spine — membrane (front) and nucleus (back)
  inGrp(LG,'text',{x:front.x+ox-6,y:front.y+12,'text-anchor':'middle','font-size':'9',fill:ZONES[7].color,opacity:'0.5'},'膜');
  inGrp(LG,'text',{x:back.x+ox-6, y:back.y-7, 'text-anchor':'middle','font-size':'9',fill:ZONES[0].color,opacity:'0.5'},'核');
}

// ── TITLE & HEADER ────────────────────────────────────────────────────────────
e('text',{x:750,y:44,'text-anchor':'middle',
  'font-family':"'SF Mono','Fira Code','Consolas',monospace",
  'font-size':'21','font-weight':'bold',fill:'#e2e8f0','letter-spacing':'2',
},'CELL OS — QI TENSOR FIELD');
e('text',{x:750,y:68,'text-anchor':'middle',
  'font-family':"'SF Mono','Fira Code','Consolas',monospace",
  'font-size':'12',fill:'#64748b','letter-spacing':'0.5',
},'8 zones × 3 phases × 11 scales = 264 cells · 36 populated (13.6% density) · 33 unique coordinates');

// Density bar
{
  const bx=580,by=82,bw=340,bh=4;
  e('rect',{x:bx,y:by,width:bw,height:bh,rx:2,fill:'#1e293b'});
  e('rect',{x:bx,y:by,width:Math.round(bw*0.136),height:bh,rx:2,fill:'#38bdf8',opacity:'0.8'});
  e('text',{x:bx+Math.round(bw*0.136)+7,y:by+bh,
    'font-family':"'SF Mono','Fira Code','Consolas',monospace",
    'font-size':'9',fill:'#38bdf8',opacity:'0.8',
  },'13.6% · amber density tier');
}

// ── ZONE LEGEND (right panel) ─────────────────────────────────────────────────
{
  const lx=1290, ly=160;
  e('text',{x:lx,y:ly-16,'font-family':"'SF Mono','Fira Code','Consolas',monospace",
    'font-size':'10',fill:'#475569','letter-spacing':'3'},'ZONE AXIS');
  e('line',{x1:lx,y1:ly-8,x2:lx+270,y2:ly-8,stroke:'#1e293b','stroke-width':'1'});

  for (let z=0;z<8;z++) {
    const zone=ZONES[z], zy=ly+z*41, dx=lx+10;
    // Glow dot
    e('circle',{cx:dx,cy:zy+9,r:12,fill:zone.color,opacity:'0.07'});
    e('circle',{cx:dx,cy:zy+9,r:7, fill:zone.color,opacity:'0.18'});
    e('circle',{cx:dx,cy:zy+9,r:4, fill:zone.color,opacity:'0.60'});
    e('circle',{cx:dx,cy:zy+9,r:2, fill:'#ffffff',  opacity:'0.9'});
    // Name
    e('text',{x:dx+18,y:zy+6,'font-family':"'SF Mono','Fira Code','Consolas',monospace",
      'font-size':'12','font-weight':'bold',fill:zone.color,opacity:'0.9'},`${zone.glyph} ${zone.name}`);
    // Depth info
    const d=7-z;
    e('text',{x:dx+18,y:zy+20,'font-family':"'SF Mono','Fira Code','Consolas',monospace",
      'font-size':'8.5',fill:zone.color,opacity:'0.42'},
      `depth ${d}${d===7?' · back':d===0?' · front':''}`);
    // Count badge
    const cnt=QI.filter(q=>q.z===z).length;
    if (cnt>0) {
      e('rect',{x:dx+246,y:zy+2,width:22,height:16,rx:4,fill:zone.color,opacity:'0.14'});
      e('text',{x:dx+257,y:zy+14,'font-family':"'SF Mono','Fira Code','Consolas',monospace",
        'font-size':'10','font-weight':'bold',fill:zone.color,'text-anchor':'middle'},String(cnt));
    }
  }
}

// ── PHASE LEGEND ──────────────────────────────────────────────────────────────
{
  const lx=1290, ly=552;
  e('text',{x:lx,y:ly-16,'font-family':"'SF Mono','Fira Code','Consolas',monospace",
    'font-size':'10',fill:'#475569','letter-spacing':'3'},'PHASE AXIS');
  e('line',{x1:lx,y1:ly-8,x2:lx+270,y2:ly-8,stroke:'#1e293b','stroke-width':'1'});

  for (let p=0;p<3;p++) {
    const ph=PHASES[p], py=ly+p*44;
    e('rect',{x:lx,y:py,width:90,height:22,rx:4,fill:ph.color,opacity:'0.11'});
    e('text',{x:lx+45,y:py+15,'font-family':"'SF Mono','Fira Code','Consolas',monospace",
      'font-size':'12','font-weight':'bold',fill:ph.color,'text-anchor':'middle'},`${ph.abbr} — ${ph.label}`);
    const cnt=QI.filter(q=>q.p===p).length;
    e('text',{x:lx+98,y:py+15,'font-family':"'SF Mono','Fira Code','Consolas',monospace",
      'font-size':'10',fill:ph.color,opacity:'0.6'},`${cnt} entries`);
  }
}

// ── SCALE LEGEND ──────────────────────────────────────────────────────────────
{
  const lx=1290, ly=694;
  e('text',{x:lx,y:ly-16,'font-family':"'SF Mono','Fira Code','Consolas',monospace",
    'font-size':'10',fill:'#475569','letter-spacing':'3'},'SCALE AXIS  (0 → 10)');
  e('line',{x1:lx,y1:ly-8,x2:lx+270,y2:ly-8,stroke:'#1e293b','stroke-width':'1'});
  e('text',{x:lx,y:ly+12,'font-family':"'SF Mono','Fira Code','Consolas',monospace",
    'font-size':'9',fill:'#475569'},SCALES.slice(0,6).join(' · '));
  e('text',{x:lx,y:ly+26,'font-family':"'SF Mono','Fira Code','Consolas',monospace",
    'font-size':'9',fill:'#475569'},SCALES.slice(6).join(' · '));
}

// ── MULTI-OCCUPANCY NOTE ──────────────────────────────────────────────────────
{
  const lx=1290, ly=758;
  e('rect',{x:lx,y:ly,width:270,height:76,rx:5,fill:'#0d1929',stroke:'#1e293b','stroke-width':'1'});
  e('text',{x:lx+10,y:ly+16,'font-family':"'SF Mono','Fira Code','Consolas',monospace",
    'font-size':'10','font-weight':'bold',fill:'#94a3b8','letter-spacing':'1'},'MULTI-OCCUPIED CELLS  ×3');
  [
    'cytoplasm × affect × cellular  (×2)',
    'golgi × expression × textual  (×2)',
    'membrane × perception × cellular  (×2)',
  ].forEach((txt,i)=>{
    e('text',{x:lx+10,y:ly+33+i*14,'font-family':"'SF Mono','Fira Code','Consolas',monospace",
      'font-size':'9',fill:'#475569'},txt);
  });
}

// ── SOURCE FOOTER ─────────────────────────────────────────────────────────────
e('text',{x:1580,y:890,'text-anchor':'end',
  'font-family':"'SF Mono','Fira Code','Consolas',monospace",
  'font-size':'8.5',fill:'#1e3a5f',
},'source: src/domain/content/qiMatrix.ts · QI_INTERSECTIONS[36] · QI_AXES · CellShellProvider.tsx zone colors');
</script>
</body>
</html>
