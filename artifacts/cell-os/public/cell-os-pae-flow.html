// ── SVG helpers ───────────────────────────────────────────────────────────────
function bandDot(band, x, y) {
  if (!band) return "";
  return `<circle cx="${x}" cy="${y}" r="5.5" fill="${BC[band]}" fill-opacity="0.9"/>`;
}

function confBar(conf, sigma, x, y, w) {
  if (!conf) return "";
  const colors = { verified:"#4ade80", indicative:"#fbbf24", speculative:"#f87171" };
  const col = colors[conf] || "#94a3b8";
  const sw = sigma ? (sigma * w * 0.6).toFixed(0) : w * 0.3;
  return `<rect x="${x}" y="${y}" width="${sw}" height="3" rx="1.5" fill="${col}" fill-opacity="0.7"/>`;
}

// ── Phase column content ──────────────────────────────────────────────────────
const CARD_H  = 118;
const CARD_GAP = 10;
const COL_PAD = 16;
const CARD_START_Y = 380;

function renderCards(cards, phase) {
  const cx = phase.x;
  const cw = phase.w;
  return cards.map((c, i) => {
    const y = CARD_START_Y + i * (CARD_H + CARD_GAP);
    const col = ZC[c.zone];
    const bCol = c.band ? BC[c.band] : null;
    return `
<g id="pae-${c.id}">
  <rect x="${cx+COL_PAD}" y="${y}" width="${cw-COL_PAD*2}" height="${CARD_H}" rx="10" fill="#1e293b" stroke="${col}" stroke-width="1.8"/>
  <rect x="${cx+COL_PAD}" y="${y}" width="5" height="${CARD_H}" rx="3" fill="${col}"/>
  <text x="${cx+COL_PAD+14}" y="${y+20}" fill="${col}" font-size="13" font-weight="700" font-family="Courier New,monospace">${c.name}</text>
  ${bCol ? bandDot(c.band, cx+cw-COL_PAD-14, y+16) : ""}
  <text x="${cx+COL_PAD+14}" y="${y+36}" fill="#94a3b8" font-size="10.5" font-family="Courier New,monospace">${c.android}</text>
  <text x="${cx+COL_PAD+14}" y="${y+52}" fill="#64748b" font-size="9.5" font-family="Courier New,monospace" xml:space="preserve">${(c.fp5||"").length > 90 ? c.fp5.substring(0,89)+"…" : (c.fp5||"")}</text>
  <rect x="${cx+COL_PAD+14}" y="${y+64}" width="${cw-COL_PAD*2-28}" height="1" fill="#334155"/>
  <text x="${cx+COL_PAD+14}" y="${y+78}" fill="#475569" font-size="9" font-family="Courier New,monospace">${c.link||""}</text>
  ${c.sigma !== null && c.sigma !== undefined ? confBar(c.conf, c.sigma, cx+COL_PAD+14, y+90, cw-COL_PAD*2-28) : ""}
  ${c.sigma !== null && c.sigma !== undefined ? `<text x="${cx+COL_PAD+14}" y="${y+109}" fill="${c.conf==="verified"?"#4ade80":c.conf==="indicative"?"#fbbf24":"#f87171"}" font-size="9.5" font-family="Courier New,monospace">${c.conf}  σ=${c.sigma}</text>` : `<text x="${cx+COL_PAD+14}" y="${y+109}" fill="#475569" font-size="9.5" font-family="Courier New,monospace">structural node — no biophoton σ assigned</text>`}
</g>`;
  }).join("\n");
}

    <path d="M0,0 L0,7 L9,3.5 z" fill="${BC[b]}"/>
  </marker>`
).join("\n");

  return `url(#parr-${(band||"red").replace(/[^a-z]/g,'')})`;
}

}

${renderCards(PERCEPTION_CARDS, PHASES[0])}

<!-- ── THREE-SCALE TABLE ──────────────────────────────────────────── -->
${tableHeader}
${tableRows}
