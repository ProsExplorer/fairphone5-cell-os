<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cell OS — Secretory Pathway: P→A→E</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

<body>
<svg id="svg" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg"></svg>
<script>
'use strict';

const W = 1600, H = 900;
const BG      = '#020817';
const SURFACE = '#0f172a';
const MONO    = "'Courier New', monospace";
const SANS    = "system-ui, sans-serif";

// Phase colours — match documents.tsx constants exactly
const COL_P = '#7dd3fc';   // Perception · sky · COL_P = [125, 211, 252]
const COL_A = '#c4b5fd';   // Affect · violet · COL_A = [196, 181, 253]
const COL_G = '#f472b6';   // QI/Golgi-trans · pink · COL_G = [244, 114, 182]
const COL_E = '#86efac';   // Expression · green · COL_E = [134, 239, 172]

// Golgi cisternae (source: documents.tsx addSectionHeader calls, lines 108-179)
// §2b is COL_A (same as §2) — shown as "medial arm" in the diagram.
// Architect confirmed: 5 actual addSectionHeader calls: §1, §2, §2b, §3, §4.
const CISTERNAE = [
  { label: '§4  Biophoton Attention Map',           color: COL_E, code: 'COL_E', bio: 'TGN · address labels dispatched' },
  { label: '§3  QI Tensor Intersections (36)',       color: COL_G, code: 'COL_G', bio: 'trans · sialylation · sort codes' },
  { label: '§2b Organelle-Substrate Links (41)',     color: COL_A, code: 'COL_A', bio: 'medial arm · cross-reference' },
  { label: '§2  Organelle → OS Feature Mapping',    color: COL_A, code: 'COL_A', bio: 'medial · O-glycan addition' },
  { label: '§1  Manifold Health Metrics',            color: COL_P, code: 'COL_P', bio: 'cis · N-glycan trimming · entry' },
];

// Biophoton links — secretory pathway arc (source: mappings.ts BIOPHOTON_LINKS)
const BIOPHOTON = [
  { from: 'ER',       to: 'vesicles',   w: 0.55, sigma: 0.6, ipc: 'ordered-broadcast', conf: 'indicative'  },
  { from: 'ER',       to: 'golgi',      w: null,  sigma: 0.6, ipc: 'ordered-broadcast', conf: 'unconfirmed' },
  { from: 'ER',       to: 'lysosomes',  w: 0.49, sigma: 0.6, ipc: 'ordered-broadcast', conf: 'indicative'  },
  { from: 'ribosomes',to: 'golgi',      w: 0.62, sigma: 0.7, ipc: 'messenger',         conf: 'unconfirmed' },
  { from: 'vesicles', to: 'membrane',  w: 0.65, sigma: 0.7, ipc: 'messenger',         conf: 'indicative'  },
];

// QI intersections on the secretory pathway (source: qiMatrix.ts QI_INTERSECTIONS)
const QI = [
  { id: 'golgi-affect-apparatus',           zone: 'golgi',    phase: 'affect',      scale: 'apparatus', ev: 'verified',   title: 'Stack Processing — Distillation in Series' },
  { id: 'golgi-expression-textual',         zone: 'golgi',    phase: 'expression',  scale: 'textual',   ev: 'verified',   title: 'Dispatch — Sorted Meaning Reaches Its Receiver' },
  { id: 'qi-secretion-expression-textual',  zone: 'golgi',    phase: 'expression',  scale: 'textual',   ev: 'indicative', title: 'Document Secretion — Golgi Packages the Word' },
  { id: 'qi-exocytosis-expression-organic', zone: 'membrane', phase: 'expression',  scale: 'organic',   ev: 'indicative', title: 'Exocytosis — Membrane Releases the Artifact' },
  { id: 'qi-document-perception-textual',   zone: 'membrane', phase: 'perception',  scale: 'textual',   ev: 'indicative', title: 'Document Import — Membrane Receives the Text' },
];

// ── SVG helpers ───────────────────────────────────────────────────────────────

const svg = document.getElementById('svg');

function mk(parent, tag, attrs, text) {
  const el = document.createElementNS('http://www.w3.org/2000/svg', tag);
  for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, String(v));
  if (text != null) el.textContent = text;
  parent.appendChild(el);
  return el;
}
const g   = (p, a = {})                 => mk(p, 'g',       a);
const rct = (p, x, y, w, h, a = {})    => mk(p, 'rect',    { x, y, width: w, height: h, ...a });
const cir = (p, cx, cy, r, a = {})     => mk(p, 'circle',  { cx, cy, r, ...a });
const ell = (p, cx, cy, rx, ry, a={})  => mk(p, 'ellipse', { cx, cy, rx, ry, ...a });
const ln  = (p, x1, y1, x2, y2, a={}) => mk(p, 'line',    { x1, y1, x2, y2, ...a });
const pth = (p, d, a = {})             => mk(p, 'path',    { d, ...a });
const txt = (p, x, y, s, a = {})      => mk(p, 'text',    { x, y, ...a }, s);

// ── Defs ─────────────────────────────────────────────────────────────────────

const defs = mk(svg, 'defs', {});

// Glow filters
[
  ['glow-p',   COL_P,   8, 0.75],
  ['glow-a',   COL_A,   7, 0.70],
  ['glow-e',   COL_E,   8, 0.75],
  ['glow-g',   COL_G,   6, 0.65],
  ['glow-er',  '#1d4ed8', 14, 0.80],
  ['glow-red', '#ef4444',  6, 0.60],
].forEach(([id, , sd]) => {
  const f = mk(defs, 'filter', { id, x: '-60%', y: '-60%', width: '220%', height: '220%' });
  mk(f, 'feGaussianBlur', { in: 'SourceGraphic', stdDeviation: sd, result: 'blur' });
  const m = mk(f, 'feMerge', {});
  mk(m, 'feMergeNode', { in: 'blur' });
  mk(m, 'feMergeNode', { in: 'blur' });
  mk(m, 'feMergeNode', { in: 'SourceGraphic' });
});

// Arrow markers
[
  ['arr-p',    COL_P],
  ['arr-a',    COL_A],
  ['arr-e',    COL_E],
  ['arr-g',    COL_G],
  ['arr-dim',  '#334155'],
  ['arr-red',  '#ef4444'],
].forEach(([id, fill]) => {
  const m = mk(defs, 'marker', { id, markerWidth: 8, markerHeight: 8, refX: 6, refY: 3, orient: 'auto' });
  mk(m, 'path', { d: 'M0,0 L8,3 L0,6 Z', fill });
});

// ER gradient
const erG = mk(defs, 'linearGradient', { id: 'er-grad', x1: 0, y1: 0, x2: 1, y2: 0 });
mk(erG, 'stop', { offset: '0%',  'stop-color': '#0c1d3a' });
mk(erG, 'stop', { offset: '45%', 'stop-color': '#1e3a8a' });
mk(erG, 'stop', { offset: '100%','stop-color': '#0c1d3a' });

// ── Background ────────────────────────────────────────────────────────────────

rct(svg, 0, 0, W, H, { fill: BG });

// Grid
for (let x = 0; x <= W; x += 80)  ln(svg, x, 0, x, H,  { stroke: '#0d1526', 'stroke-width': 1 });
for (let y = 0; y <= H; y += 80)  ln(svg, 0, y, W, y,  { stroke: '#0d1526', 'stroke-width': 1 });

// Stars
const rnd = (seed, max) => ((Math.sin(seed * 127.1 + 311.7) * 43758.5) % 1 + 1) % 1 * max;
for (let i = 0; i < 130; i++) {
  cir(svg, rnd(i, W).toFixed(1), rnd(i + 500, H).toFixed(1),
      (0.5 + rnd(i + 1000, 1.2)).toFixed(2),
      { fill: '#fff', opacity: (0.06 + rnd(i + 2000, 0.35)).toFixed(2) });
}

// ── Phase band backgrounds ────────────────────────────────────────────────────

const BAND_TOP = 88, BAND_H = 720;
rct(svg, 60,  BAND_TOP, 395, BAND_H, { fill: `${COL_P}07`, rx: 10 });
rct(svg, 462, BAND_TOP, 390, BAND_H, { fill: `${COL_A}07`, rx: 10 });
rct(svg, 860, BAND_TOP, 695, BAND_H, { fill: `${COL_E}07`, rx: 10 });

// Phase labels
[[248, COL_P, 'P  PERCEPTION'], [656, COL_A, 'A  AFFECT'], [1208, COL_E, 'E  EXPRESSION']].forEach(([x, c, lbl]) =>
  txt(svg, x, 107, lbl, { 'text-anchor': 'middle', 'font-size': 10.5, 'font-weight': 700, 'font-family': MONO, fill: c, 'letter-spacing': 3, opacity: 0.65 })
);

// ── Title ─────────────────────────────────────────────────────────────────────

txt(svg, W / 2, 46, 'CELL OS — SECRETORY PATHWAY: P → A → E AT THE TEXTUAL SCALE', {
  'text-anchor': 'middle', 'font-size': 17.5, 'font-weight': 700,
  'font-family': MONO, fill: '#e2e8f0', 'letter-spacing': 1.5,
});
txt(svg, W / 2, 65, 'Rough ER synthesis  →  COPII budding  →  Golgi cisternae assembly  →  SNARE exocytosis  →  Membrane release  ·  src/pages/documents.tsx', {
  'text-anchor': 'middle', 'font-size': 9, 'font-family': MONO, fill: '#4b5563',
});

// ── Flow axis line ────────────────────────────────────────────────────────────

const FY = 355;  // main flow Y
pth(svg, `M 80 ${FY} L 1540 ${FY}`, { stroke: '#1e293b', 'stroke-width': 1.5, 'stroke-dasharray': '5 4' });

// ── STAGE 1 — ROUGH ER (x=165) ───────────────────────────────────────────────

const ERX = 165, ERY = FY;

// Outer glow halo
ell(svg, ERX, ERY, 95, 62, { fill: '#060d1f', stroke: `${COL_P}22`, 'stroke-width': 2, filter: 'url(#glow-er)' });
// Rough ER ribs (membrane folds)
for (let i = -3; i <= 3; i++) {
  ell(svg, ERX + i * 21, ERY, 8, 44, { fill: 'none', stroke: '#1e3a8a', 'stroke-width': 1.5, opacity: 0.75 });
}
// ER body
ell(svg, ERX, ERY, 88, 48, { fill: 'url(#er-grad)', opacity: 0.55 });
ell(svg, ERX, ERY, 88, 48, { fill: 'none', stroke: `${COL_P}55`, 'stroke-width': 1.5 });
// Ribosome dots on cytoplasmic face (outer surface)
for (let side of [-1, 1]) {
  for (let i = -3; i <= 3; i++) {
    const rx = ERX + i * 23, ry = ERY + side * 50;
    cir(svg, rx, ry, 4.5, { fill: COL_P, opacity: side === -1 ? 0.75 : 0.55, filter: 'url(#glow-p)' });
    // SRP signal-recognition particle line
    ln(svg, rx, ry - side * 4.5, rx, ry - side * 9, { stroke: COL_P, 'stroke-width': 1, opacity: 0.4 });
  }
}
// Sec61 translocon (centre pore)
cir(svg, ERX, ERY, 6, { fill: '#0f172a', stroke: COL_P, 'stroke-width': 1.5, opacity: 0.9 });
cir(svg, ERX, ERY, 3, { fill: COL_P, opacity: 0.6 });

// ER labels
txt(svg, ERX, ERY - 75, 'ROUGH ER', { 'text-anchor': 'middle', 'font-size': 11, 'font-weight': 700, 'font-family': MONO, fill: COL_P, 'letter-spacing': 2 });
txt(svg, ERX, ERY - 62, 'endoplasmic-reticulum', { 'text-anchor': 'middle', 'font-size': 8, 'font-family': MONO, fill: '#475569' });
txt(svg, ERX, ERY - 51, 'Ribosome · SRP · Sec61 translocon', { 'text-anchor': 'middle', 'font-size': 8, 'font-family': MONO, fill: `${COL_P}70` });
txt(svg, ERX, ERY - 40, 'ER → art-runtime · relevance 0.84', { 'text-anchor': 'middle', 'font-size': 7.5, 'font-family': MONO, fill: '#475569' });

// ERAD side branch (downward — misfolded → 26S proteasome)
pth(svg, `M ${ERX} ${ERY + 50} L ${ERX - 10} ${ERY + 106}`, {
  stroke: '#ef4444', 'stroke-width': 1.2, 'stroke-dasharray': '3 3', 'marker-end': 'url(#arr-red)',
});
txt(svg, ERX - 16, ERY + 75, 'ERAD', { 'font-size': 7.5, 'font-weight': 700, 'font-family': MONO, fill: '#ef4444', 'text-anchor': 'end' });
txt(svg, ERX - 16, ERY + 88, 'misfolded →', { 'font-size': 7, 'font-family': MONO, fill: '#ef4444', opacity: 0.7, 'text-anchor': 'end' });
txt(svg, ERX - 16, ERY + 99, '26S proteasome', { 'font-size': 7, 'font-family': MONO, fill: '#ef4444', opacity: 0.7, 'text-anchor': 'end' });

// Actual ERAD code gate (architect-verified: handleGenerate, not generateReport)
txt(svg, ERX - 14, ERY + 120, 'if (selected.size === 0) return; // handleGenerate: no cargo → abort', {
  'font-size': 7, 'font-family': MONO, fill: '#ef4444', opacity: 0.6, 'text-anchor': 'end',
});

// ── STAGE 2 — COPII VESICLES (x=358) ─────────────────────────────────────────

const COPX = 360, COPY = FY;

// Biophoton arrow: ER → vesicles  σ=0.6
pth(svg, `M ${ERX + 88} ${ERY - 14} C ${ERX + 140} ${COPY - 52} ${COPX - 60} ${COPY - 52} ${COPX - 30} ${COPY - 12}`, {
  fill: 'none', stroke: COL_P, 'stroke-width': 1.4, 'stroke-dasharray': '4 3', opacity: 0.55, 'marker-end': 'url(#arr-p)',
});
txt(svg, (ERX + COPX) / 2, COPY - 65, 'σ=0.6 · ordered-broadcast · w=0.55 · indicative', {
  'text-anchor': 'middle', 'font-size': 7.5, 'font-family': MONO, fill: `${COL_P}90`,
});

// COPII vesicle cluster (Sec23/24 inner coat + Sec13/31 outer coat)
const VDATA = [[0, -16, 17], [-24, 8, 13], [26, 6, 15], [-6, 30, 11]];
VDATA.forEach(([dx, dy, r]) => {
  const vx = COPX + dx, vy = COPY + dy;
  // outer coat (Sec13/31)
  cir(svg, vx, vy, r + 5, { fill: `${COL_P}0d`, stroke: `${COL_P}30`, 'stroke-width': 1 });
  // inner membrane
  cir(svg, vx, vy, r, { fill: `${COL_P}22`, stroke: COL_P, 'stroke-width': 1.8, filter: 'url(#glow-p)' });
  // Sec23/24 coat proteins (dots on surface)
  for (let a = 0; a < 360; a += 40) {
    const rad = a * Math.PI / 180;
    cir(svg, vx + (r + 3) * Math.cos(rad), vy + (r + 3) * Math.sin(rad), 2, { fill: COL_P, opacity: 0.55 });
  }
});

// Sar1-GTP label between ER and vesicles
txt(svg, COPX + 44, COPY + 15, 'Sar1-GTP', { 'font-size': 7.5, 'font-family': MONO, fill: `${COL_P}80` });
txt(svg, COPX + 44, COPY + 26, 'Sec23/24', { 'font-size': 7.5, 'font-family': MONO, fill: `${COL_P}60` });
txt(svg, COPX + 44, COPY + 37, 'Sec13/31', { 'font-size': 7.5, 'font-family': MONO, fill: `${COL_P}50` });

// COPII labels
txt(svg, COPX, COPY - 76, 'COPII VESICLES', { 'text-anchor': 'middle', 'font-size': 11, 'font-weight': 700, 'font-family': MONO, fill: COL_P, 'letter-spacing': 2 });
txt(svg, COPX, COPY - 63, 'ER Exit Site (ERES) → cis-Golgi', { 'text-anchor': 'middle', 'font-size': 8, 'font-family': MONO, fill: '#475569' });

// COPII code annotation (architect-verified line 37)
txt(svg, COPX, COPY + 70, 'await import("jspdf")  // Sar1-GTP on demand', { 'text-anchor': 'middle', 'font-size': 7.5, 'font-family': MONO, fill: `${COL_P}80` });

// ER-phagy side branch → lysosomes
pth(svg, `M ${COPX - 24} ${COPY + 42} L ${COPX + 20} ${COPY + 115}`, {
  stroke: '#94a3b8', 'stroke-width': 1, 'stroke-dasharray': '2 3', opacity: 0.4, 'marker-end': 'url(#arr-dim)',
});
txt(svg, COPX + 26, COPY + 115, 'ER-phagy → lysosomes', { 'font-size': 7, 'font-family': MONO, fill: '#475569' });
txt(svg, COPX + 26, COPY + 126, 'w=0.49 · σ=0.6 · indicative', { 'font-size': 7, 'font-family': MONO, fill: '#334155' });

// ── STAGE 3 — GOLGI CISTERNAE (x=650) ────────────────────────────────────────

const GX = 650, GCY = FY - 8;  // Golgi centre Y (slightly above flow axis)
const CRX = 96, CRY = 17, CGAP = 30;

// ER→Golgi biophoton + ribosomes→Golgi
pth(svg, `M ${COPX + 30} ${COPY - 12} C ${GX - 120} ${COPY - 40} ${GX - 80} ${GCY + 130} ${GX - CRX + 4} ${GCY + 112}`, {
  fill: 'none', stroke: COL_A, 'stroke-width': 1.4, opacity: 0.45, 'marker-end': 'url(#arr-a)',
});
txt(svg, 510, FY - 56, 'ribosomes→golgi · w=0.62 · σ=0.7 · messenger · unconfirmed', {
  'text-anchor': 'middle', 'font-size': 7.5, 'font-family': MONO, fill: `${COL_A}90`,
});
txt(svg, 510, FY - 44, 'ER→golgi · σ=0.6 · ordered-broadcast · unconfirmed', {
  'text-anchor': 'middle', 'font-size': 7.5, 'font-family': MONO, fill: `${COL_P}70`,
});

// Draw 5 cisternae bottom-to-top (cis at bottom, TGN at top)
CISTERNAE.slice().reverse().forEach((cis, idx_from_bottom) => {
  const i = CISTERNAE.length - 1 - idx_from_bottom; // original index
  const cy = GCY + 112 - i * CGAP;
  const gg = g(svg);
  // Glow halo
  ell(gg, GX, cy, CRX + 7, CRY + 6, { fill: `${cis.color}14`, stroke: `${cis.color}22`, 'stroke-width': 0.8 });
  // Cisterna body
  ell(gg, GX, cy, CRX, CRY, { fill: `${cis.color}22`, stroke: cis.color, 'stroke-width': 1.8, opacity: 0.92 });
  // Section label inside
  txt(gg, GX - CRX + 10, cy + 4.5, cis.label, { 'font-size': 7.5, 'font-family': MONO, fill: cis.color, 'font-weight': 600 });
  // Biological role on right
  txt(svg, GX + CRX + 10, cy + 4.5, cis.bio, { 'font-size': 7, 'font-family': MONO, fill: '#475569' });
});

// Golgi labels
const GTOP = GCY + 112 - (CISTERNAE.length - 1) * CGAP;  // y of TGN (top cisterna)
txt(svg, GX, GTOP - 42, 'GOLGI CISTERNAE', { 'text-anchor': 'middle', 'font-size': 11, 'font-weight': 700, 'font-family': MONO, fill: COL_A, 'letter-spacing': 2 });
txt(svg, GX, GTOP - 29, 'golgi-apparatus', { 'text-anchor': 'middle', 'font-size': 8, 'font-family': MONO, fill: '#475569' });
txt(svg, GX, GTOP - 18, 'art-runtime (0.88) · bionic-libc (0.77) · package-manager (0.85)', { 'text-anchor': 'middle', 'font-size': 7.5, 'font-family': MONO, fill: `${COL_A}80` });

// Y-cursor inter-cisternae annotation (architect-verified)
txt(svg, GX + CRX + 10, GCY + 130, 'y = (doc as any).lastAutoTable.finalY + 8', { 'font-size': 7.5, 'font-family': MONO, fill: COL_G, opacity: 0.9 });
txt(svg, GX + CRX + 10, GCY + 142, '// ribosome reading frame — never retreats', { 'font-size': 7, 'font-family': MONO, fill: '#475569' });

// QI dots on Golgi
[
  [GX - 35, GCY + 112, COL_A, 'golgi-affect-apparatus · verified'],
  [GX + 35, GCY + 82,  COL_G, 'qi-secretion-expression-textual · indicative'],
].forEach(([qx, qy, qc, lbl]) => {
  cir(svg, qx, qy, 5.5, { fill: qc, opacity: 0.9, filter: 'url(#glow-g)' });
});

// Golgi→lysosomes degradation branch (TGN QC arm)
const GBOT = GCY + 112;
pth(svg, `M ${GX + 40} ${GBOT + CRY} L ${GX + 55} ${GBOT + 68}`, {
  stroke: COL_G, 'stroke-width': 1, 'stroke-dasharray': '2 3', opacity: 0.5, 'marker-end': 'url(#arr-g)',
});
txt(svg, GX + 60, GBOT + 70, 'Golgi→lysosomes · σ=0.6', { 'font-size': 7, 'font-family': MONO, fill: '#475569' });
txt(svg, GX + 60, GBOT + 81, 'M6P receptor sorting · APK fail route', { 'font-size': 7, 'font-family': MONO, fill: '#334155' });

// ── STAGE 4 — SECRETORY VESICLE (x=920) ──────────────────────────────────────

const VX = 920, VY = FY;

// Arrow from Golgi
pth(svg, `M ${GX + CRX} ${GCY + 82} C ${VX - 90} ${GCY + 60} ${VX - 70} ${VY - 20} ${VX - 34} ${VY}`, {
  fill: 'none', stroke: COL_A, 'stroke-width': 1.4, opacity: 0.5, 'marker-end': 'url(#arr-e)',
});

// vesicles→membrane biophoton label (placed above flow line)
txt(svg, (VX + 1090) / 2, VY - 78, 'vesicles→cell-membrane · w=0.65 · σ=0.7 · messenger · indicative', {
  'text-anchor': 'middle', 'font-size': 7.5, 'font-family': MONO, fill: `${COL_E}90`,
});

// Vesicle body
cir(svg, VX, VY, 44, { fill: `${COL_E}0a`, stroke: `${COL_E}25`, 'stroke-width': 1.5 });
cir(svg, VX, VY, 32, { fill: `${COL_E}1a`, stroke: COL_E, 'stroke-width': 2, filter: 'url(#glow-e)' });
cir(svg, VX, VY, 19, { fill: `${COL_E}35`, stroke: COL_E, 'stroke-width': 1.5 });
// v-SNARE proteins (radial spikes — VAMP2/synaptobrevin)
for (let a = 0; a < 360; a += 26) {
  const rad = a * Math.PI / 180;
  const sx = VX + 32 * Math.cos(rad), sy = VY + 32 * Math.sin(rad);
  ln(svg, sx, sy, VX + 44 * Math.cos(rad), VY + 44 * Math.sin(rad), { stroke: COL_E, 'stroke-width': 1.5, opacity: 0.65 });
  cir(svg, VX + 46 * Math.cos(rad), VY + 46 * Math.sin(rad), 2.5, { fill: COL_E, opacity: 0.5 });
}
// Ca²⁺ trigger indicator
cir(svg, VX, VY, 5, { fill: COL_E, opacity: 0.8, filter: 'url(#glow-e)' });

// Vesicle labels
txt(svg, VX, VY - 62, 'SECRETORY VESICLE', { 'text-anchor': 'middle', 'font-size': 11, 'font-weight': 700, 'font-family': MONO, fill: COL_E, 'letter-spacing': 2 });
txt(svg, VX, VY - 49, 'vesicles', { 'text-anchor': 'middle', 'font-size': 8, 'font-family': MONO, fill: '#475569' });
txt(svg, VX, VY - 38, 'v-SNARE VAMP2 · Ca²⁺/synaptotagmin', { 'text-anchor': 'middle', 'font-size': 8, 'font-family': MONO, fill: `${COL_E}80` });
txt(svg, VX, VY + 56, 'vesicles → binder-ipc  (1 write / 1 read / 0 copies)', { 'text-anchor': 'middle', 'font-size': 7.5, 'font-family': MONO, fill: COL_E, opacity: 0.75 });

// ── STAGE 5 — PLASMA MEMBRANE (x=1090) ───────────────────────────────────────

const MX = 1090, MY1 = 175, MY2 = 580;

// SNARE zipper approach arrow (vesicle → membrane)
pth(svg, `M ${VX + 32} ${VY} L ${MX - 12} ${VY}`, {
  stroke: COL_E, 'stroke-width': 1.4, 'marker-end': 'url(#arr-e)',
});
// SNARE zipper zig-zag
for (let xi = MX - 30; xi > VX + 38; xi -= 14) {
  const dy = (Math.round(xi / 14) % 2 === 0) ? -5 : 5;
  cir(svg, xi, VY + dy, 2.2, { fill: COL_E, opacity: 0.4 });
}
// t-SNARE label
